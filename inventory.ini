[routers]
inetRouter    ansible_host=192.168.50.1
centralRouter ansible_host=192.168.50.2
inetRouter2   ansible_host=192.168.50.8

[routers:vars]
ansible_user=root
ansible_ssh_private_key_file=/root/.ssh/id_rsa
ansible_ssh_common_args='-o StrictHostKeyChecking=no'

[servers]
centralServer ansible_host=192.168.50.5

[servers:vars]
ansible_user=root
ansible_ssh_private_key_file=/root/.ssh/id_rsa
ansible_ssh_common_args='-o StrictHostKeyChecking=no'
